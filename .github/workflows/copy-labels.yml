on: [pull_request]

permissions:
  issues: read
  pull-requests: write

jobs:
  copy-labels:
    runs-on: ubuntu-latest
    name: Copy labels from linked issues
    steps:
      - name: copy-labels
        uses: michalvankodev/copy-issue-labels@f54e957e58fc976eba5ffa36e1a1030572dbb78d # v1.3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          custom-keywords: |
            solves
            implements
